name: TaskFlow AI CI and GHCR Publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Install worker dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/taskflow-ai
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.GHCR_IMAGE_PREFIX }}/frontend:main
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.GHCR_IMAGE_PREFIX }}/backend:main
      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}/worker:${{ github.sha }}
            ${{ env.GHCR_IMAGE_PREFIX }}/worker:main

      - name: Update infrastructure image tags
        env:
          INFRA_REPO_PAT: ${{ secrets.INFRA_REPO_PAT }}
          INFRA_REPO_URL: ${{ vars.INFRA_REPO_URL || 'https://github.com/saurya96/taskflow-ai-infra.git' }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$INFRA_REPO_PAT" ]; then
            echo "INFRA_REPO_PAT is not configured; infrastructure image tags were not updated"
            exit 0
          fi
          git clone "https://${INFRA_REPO_PAT}@${INFRA_REPO_URL#https://}" infra
          cd infra
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          sed -i -E "s#(ghcr.io/.*/taskflow-ai/frontend:)[^[:space:]]+#\1${SHA}#g; s#(ghcr.io/.*/taskflow-ai/backend:)[^[:space:]]+#\1${SHA}#g; s#(ghcr.io/.*/taskflow-ai/worker:)[^[:space:]]+#\1${SHA}#g" kubernetes/base/deployments.yaml
          if git diff --quiet; then echo "No infrastructure image-tag changes"; exit 0; fi
          git add kubernetes/base/deployments.yaml
          git commit -m "chore: update TaskFlow AI images to ${SHA}"
          git push
